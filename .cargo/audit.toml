# cargo-audit configuration.
# Read by `cargo audit` and by the rustsec/audit-check CI action.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack: potential key recovery through timing
    # side-channels in the `rsa` crate. No fixed upstream version exists (the
    # RustCrypto `rsa` crate has no constant-time PKCS#1 v1.5 decryption yet).
    #
    # Reaches us transitively through the bergshamra key stack. SamlDecryptor
    # rejects the vulnerable rsa-1_5 XML Encryption key-transport algorithm
    # before entering bergshamra/rsa; supported RSA-OAEP decryption and RSA
    # signature operations do not use PKCS#1 v1.5 decryption padding.
    #
    # Re-evaluate whenever a fixed `rsa` release lands.
    "RUSTSEC-2023-0071",
]
