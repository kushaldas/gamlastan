# cargo-audit configuration.
# Read by `cargo audit` and by the rustsec/audit-check CI action.

[advisories]
ignore = [
    # RUSTSEC-2026-0258 — h2 0.3.27 permits unbounded empty DATA frames,
    # potentially exhausting memory. Actix HTTP 3.21 still depends on h2 0.3;
    # retain HTTP/2 support until Actix can use the patched h2 0.4.16+ line.
    # Re-evaluate this exception when Actix updates its h2 dependency.
    "RUSTSEC-2026-0258",
]
