name: Security audit

on:
  schedule:
    # Daily at 06:17 UTC. Offset from :00 to avoid the GitHub cron rush.
    - cron: "17 6 * * *"
  push:
    # Branches only. A release tag points at a commit the branch audit has already
    # covered, and a red run on a tag only repeats advisories the daily run tracks as
    # issues. Defining only `branches` leaves tags out, whereas defining only
    # `tags-ignore` would also stop every branch push from triggering the audit.
    branches:
      - "**"
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # actix-http 3.18.12 still pins h2 0.3.27; remove when Actix migrates
          # to the patched h2 0.4.16+ line (actix/actix-web#4199).
          #
          # actix-http 3.18.12 and actix-web 4.15.0 carry RUSTSEC-2026-0446, -0447 and
          # -0448 (chunked-trailer request smuggling, unbounded decompression). The
          # patched releases (actix-http 3.20.x, actix-web 4.18.x) need Rust 1.89, above
          # the workspace rust-version of 1.88. Actix is used only by gamlastan-actix
          # and the example-idp demo, and consumers resolve their own versions. Remove
          # these when the MSRV moves to 1.89.
          ignore: RUSTSEC-2026-0258,RUSTSEC-2026-0446,RUSTSEC-2026-0447,RUSTSEC-2026-0448
